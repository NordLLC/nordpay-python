[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nordpay"
version = "1.1.3"
description = "Official Python SDK for NordPay API — crypto payment processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NORD International" },
]
keywords = [
    "nordpay", "crypto", "payments", "api", "sdk",
    "bitcoin", "ethereum", "usdt", "payment-gateway",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://nord-pay.com"
Documentation = "https://nord-3.gitbook.io/nord-api"
Repository = "https://github.com/NordLLC/nordpay-python"
Issues = "https://github.com/NordLLC/nordpay-python/issues"

[tool.hatch.build.targets.sdist]
include = ["nordpay/"]

[tool.hatch.build.targets.wheel]
packages = ["nordpay"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
